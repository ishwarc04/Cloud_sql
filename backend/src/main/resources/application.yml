spring:
  application:
    name: cloudsql-lab-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 10000
      max-lifetime: 840000
  sql:
    init:
      mode: always
server:
  port: ${PORT:8080}

cloudsql:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  workspaces:
    max-databases-per-user: 2
    storage-limit-bytes: 10485760
    query-timeout-seconds: 5
    max-returned-rows: 200
    storage-directory: ./data/workspaces
