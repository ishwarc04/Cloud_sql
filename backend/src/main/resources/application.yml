spring:
  application:
    name: cloudsql-lab-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 10000
      max-lifetime: 840000
  sql:
    init:
      mode: always
server:
  port: ${PORT:8080}

cloudsql:
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    session-hours: ${AUTH_SESSION_HOURS:24}
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  workspaces:
    max-databases-per-user: 2
    storage-limit-bytes: 10485760
    query-timeout-seconds: 5
    max-returned-rows: 200
    storage-directory: ./data/workspaces
