spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:test-platform;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always

cloudsql:
  cors:
    allowed-origins: http://localhost:5173
  workspaces:
    max-databases-per-user: 2
    storage-limit-bytes: 10485760
    query-timeout-seconds: 5
    max-returned-rows: 200
    storage-directory: ${java.io.tmpdir}/cloudsql-lab-tests
